[package]
name = "geod-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Independent GeoD Global local asset download runtime"

[dependencies]
axum = "0.8.8"
base64 = "=0.22.1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3"
png = "=0.18.1"
proj4rs = { version = "=0.2.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "system-proxy"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw", "jpeg"] }
tempfile = "=3.27.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
