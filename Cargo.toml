[workspace]
members = ["crates/geod-runtime", "src-tauri"]
default-members = ["crates/geod-runtime"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-only"

# Development startup verifies ~400 MiB of owned runtime binaries. Keep the
# same cryptographic checks without running SHA compression in debug mode.
[profile.dev.package.sha2]
opt-level = 3
