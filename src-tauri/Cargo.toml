[package]
name = "geod-global-desktop"
version = "0.1.0-rc.1"
edition = "2021"
publish = false
description = "Independent GeoD Global desktop workspace"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
geod-runtime = { path = "../crates/geod-runtime" }
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-decoration = "=3.0.5"
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
