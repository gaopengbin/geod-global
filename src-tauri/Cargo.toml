[package]
name = "geod-global-desktop"
version = "0.1.0-rc.3"
edition = "2021"
publish = false
description = "Independent GeoD Global desktop workspace"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
geod-runtime = { path = "../crates/geod-runtime" }
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = "=2.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "system-proxy", "socks"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
minisign-verify = "=0.2.5"
tempfile = "=3.27.0"
tauri-plugin-decoration = "=3.0.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
url = "2"
zeroize = { version = "=1.9.0", features = ["serde"] }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1", features = ["time", "process", "io-util", "sync"] }
lopdf = { version = "=0.45.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = { version = "=0.42.0", default-features = false }
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "isomp4", "mkv"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_Security"] }
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.12.1", features = ["test"] }
