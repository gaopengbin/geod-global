[package]
name = "geod-global-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Independent GeoD Global desktop workspace"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
geod-runtime = { path = "../crates/geod-runtime" }
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-opener = "=2.5.5"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
