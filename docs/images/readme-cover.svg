<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">GeoD Global — AI-powered 2D geospatial workspace</title>
<desc id="desc">Dark blue GeoD brand cover with decorative geographic grids and map layers. Development source, Windows, 2D data and GPLv3. Illustration, not a data visualization.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2c"/><stop offset="1" stop-color="#182b44"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#398cff"/><stop offset="1" stop-color="#65dbc4"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6b87a6" stroke-opacity=".09"/></pattern>
  <clipPath id="bounds"><rect width="1200" height="340" rx="18"/></clipPath>
</defs>
<g clip-path="url(#bounds)">
  <rect width="1200" height="340" fill="url(#background)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <path d="M0 0H1200" stroke="url(#accent)" stroke-width="5"/>
  <g fill="none" stroke="#77a6cb" stroke-opacity=".25">
    <circle cx="1000" cy="166" r="250"/><ellipse cx="1000" cy="166" rx="118" ry="250"/>
    <ellipse cx="1000" cy="166" rx="207" ry="250"/><path d="M750 166h500M775 65h450M775 267h450"/>
  </g>
  <g transform="translate(802 97) rotate(-12 150 100)" fill="none" stroke-linejoin="round">
    <path d="M0 147 169 194 322 99 152 54Z" fill="#2466b0" fill-opacity=".08" stroke="#7092b6" stroke-opacity=".5"/>
    <path d="M0 114 169 161 322 66 152 21Z" fill="#3b83e0" fill-opacity=".13" stroke="#508dd4"/>
    <path d="M0 81 169 128 322 33 152-12Z" fill="#43d5b7" fill-opacity=".07" stroke="#73dbc4" stroke-width="1.7"/>
    <path d="M42 74C95 85 87 52 141 65S204 75 238 42M74 97C116 100 119 69 166 79S226 76 273 54" stroke="#73dbc4" stroke-opacity=".65"/>
    <path d="M42 74V140M238 42V108" stroke="#73dbc4" stroke-opacity=".35" stroke-dasharray="3 5"/>
    <circle cx="42" cy="74" r="4" fill="#77e1c7"/><circle cx="238" cy="42" r="4" fill="#77e1c7"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="60" y="68" fill="#8aabc7" font-size="12" letter-spacing="3.1">AI-POWERED GEOSPATIAL WORKSPACE</text>
    <text x="56" y="154" fill="#f4f8fc" font-size="76" font-weight="650" letter-spacing="-3">GeoD <tspan fill="#75dcc8" font-weight="400">Global</tspan></text>
