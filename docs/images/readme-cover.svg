    <path d="M60 238H606" stroke="#375069"/>
    <text x="60" y="277" fill="#dbe6ef" font-size="13" letter-spacing="1.3">WINDOWS</text>
    <circle cx="159" cy="272" r="2" fill="#627f9b"/>
    <text x="179" y="277" fill="#dbe6ef" font-size="13" letter-spacing="1.3">2D DATA</text>
    <circle cx="284" cy="272" r="2" fill="#627f9b"/>
    <text x="304" y="277" fill="#dbe6ef" font-size="13" letter-spacing="1.3">IN DEVELOPMENT</text>
    <circle cx="494" cy="272" r="2" fill="#627f9b"/>
