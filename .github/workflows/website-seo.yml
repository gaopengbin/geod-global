name: Website SEO release policy
on:
  workflow_dispatch:
  push:
    paths: ['scripts/website-seo/**', '.github/workflows/website-seo.yml']
  pull_request:
    paths: ['scripts/website-seo/**', '.github/workflows/website-seo.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/website-seo/test_policy.py
