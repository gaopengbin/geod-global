name: Repository checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  artifact-transport:
    name: Artifact transport (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geod-actions-smoke-cache
          key: actions-transport-${{ runner.os }}-${{ github.run_id }}
      - name: Prepare transport-only fixtures
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          payload = root / 'geod-actions-smoke-payload'
          (payload / 'nested').mkdir(parents=True)
          (payload / 'nested/sample.bin').write_bytes(bytes(range(256)) * 4)
          (payload / 'metadata.json').write_bytes('{"fixture":"GeoD artifact transport"}\n'.encode())
          cache = root / 'geod-actions-smoke-cache'
          cache.mkdir(exist_ok=True)
          (cache / 'receipt.json').write_text(json.dumps({key: os.environ[key] for key in ['GITHUB_SHA', 'GITHUB_RUN_ID']}), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-smoke-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geod-actions-smoke-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transport-smoke-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geod-actions-smoke-received
      - name: Verify names and every downloaded byte
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def inventory(directory):
              return {file.relative_to(directory).as_posix(): hashlib.sha256(file.read_bytes()).hexdigest() for file in directory.rglob('*') if file.is_file()}
          original = inventory(root / 'geod-actions-smoke-payload')
          received = inventory(root / 'geod-actions-smoke-received')
          assert set(original) == {'metadata.json', 'nested/sample.bin'}
          assert received == original, 'Artifact transport changed file names or bytes'
          PY

  cache-restore:
    name: Cache restore (${{ matrix.os }})
    needs: artifact-transport
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restored
        with:
          path: ${{ runner.temp }}/geod-actions-smoke-cache
          key: actions-transport-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Verify cache restored across runners
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          assert os.environ['CACHE_HIT'] == 'true', 'Expected an exact cache hit'
          path = Path(os.environ['RUNNER_TEMP']) / 'geod-actions-smoke-cache/receipt.json'
          expected = {key: os.environ[key] for key in ['GITHUB_SHA', 'GITHUB_RUN_ID']}
          assert json.loads(path.read_text(encoding='utf-8')) == expected, 'Cache restored another run or source revision'
          PY

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
      # Match the package manager used to generate and validate this lockfile.
      # Do not let a newer Node patch silently change npm's lock resolution.
      - run: npm install --global npm@11.6.2 --no-fund
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@3920daf79df8fb8df1dbef6e64563e2901a73745 # 1.91.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
      - run: npm ci --no-fund
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/release.py check
      - run: python scripts/package-windows.test.py
      - run: python scripts/release.test.py
      - run: cargo fmt --all --check
      - run: npm run verify
      - run: npm run test:services
      - run: cargo test --locked -p geod-runtime
      - if: runner.os == 'Linux'
        run: cargo clippy --locked -p geod-runtime --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test --locked -p geod-global-desktop --features custom-protocol
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets --features geod-global-desktop/custom-protocol -- -D warnings
