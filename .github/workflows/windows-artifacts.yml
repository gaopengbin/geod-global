name: Windows evaluation artifacts

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  package:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@3920daf79df8fb8df1dbef6e64563e2901a73745 # 1.91.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-release
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verification/license-cache
          key: license-texts-v1-${{ hashFiles('Cargo.lock', 'package-lock.json', 'scripts/package-windows.py') }}
      - run: npm ci --no-fund
      - name: Require a clean versioned source checkout
        shell: pwsh
        run: python scripts/release.py check --commit "$env:GITHUB_SHA" --require-clean
      - name: Prepare verified portable NSIS compiler
        shell: pwsh
        run: ./scripts/setup-nsis.ps1
      - name: Build unsigned Windows ZIP and per-user installer
        shell: pwsh
        run: python scripts/package-windows.py --profile release --installer nsis --output "$env:RUNNER_TEMP/geod-packages"
      - name: Verify provenance and stage only release assets
        id: artifacts
        shell: pwsh
        run: python scripts/release.py stage --package-root "$env:RUNNER_TEMP/geod-packages" --destination "$env:RUNNER_TEMP/geod-distribution" --commit "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geod-global-windows-x64-unsigned
          path: ${{ steps.artifacts.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build summary
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          @"
          ## GeoD Global $env:PACKAGE_VERSION
          - Commit: $env:GITHUB_SHA
          - Windows x64 portable ZIP and per-user NSIS installer (unsigned evaluation).
          - Every ZIP payload file, binary build receipt, source commit and asset SHA-256 verified.
          - Installer execution and native GUI acceptance are separate release checks.
          "@ >> $env:GITHUB_STEP_SUMMARY
